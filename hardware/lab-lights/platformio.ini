; Lab light: one round screen per app, showing LogNog's green / yellow / red light.
; Build:  pio run              (compiles; does not flash)
; Flash:  pio run -t upload    (board plugged in by USB-C)
; Watch:  pio device monitor
;
; Board: Waveshare ESP32-S3-LCD-1.28 (ESP32-S3R2, 16 MB flash, 2 MB PSRAM,
; GC9A01 240x240 round IPS, USB-C). Its pins are in include/pins.h.

[platformio]
default_envs = waveshare-s3-lcd-128

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bblanchon/ArduinoJson@7.2.1
  olikraus/U8g2@2.35.30

; The board in the parts list (and its touch twin, ESP32-S3-Touch-LCD-1.28:
; same screen wiring, the touch chip is simply unused).
[env:waveshare-s3-lcd-128]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Any ESP32-S3-DevKitC-1 with a loose GC9A01 1.28" module wired to the same
; GPIOs as include/pins.h (see README "Wiring a loose screen").
[env:devkitc-gc9a01]
board = esp32-s3-devkitc-1
